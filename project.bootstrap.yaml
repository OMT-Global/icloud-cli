version: 1
project:
  name: icloud-cli
  displayName: iCloud CLI
  description: macOS command-line tools for reading iCloud-backed Apple state, starting with Safari tabs.
  visibility: public
  owner: OMT-Global
  defaultBranch: main
repo:
  # Preserve native Swift guidance and the live team-based governance contract.
  # Bootstrap owns only these byte-compatible generic artifacts.
  managedPaths:
    - .githooks/pre-commit
    - .github/ISSUE_TEMPLATE/implementation.yml
    - .github/ISSUE_TEMPLATE/flow_blocker.yml
archetype:
  kind: generic-empty
  packageManager: swift
  moduleName: icloud_cli
github:
  createRepo: true
  reviewers:
    - jmcte
  flowGovernance: true
  autoMerge: true
  deleteBranchOnMerge: true
  requiredApprovals: 1
  requiredStatusChecks:
    - CI Gate
  repoFeatures:
    hasIssues: true
    hasProjects: true
    hasWiki: false
    hasDiscussions: false
ci:
  codeqlLanguages:
    - swift
  runnerPolicy: hybrid-safe
  fastChecks:
    - build
    - test
    - coverage
    - mutation
    - secrets
release:
  enabled: true
  artifact: macos-universal-dmg
  signingIdentity: com.omtglobal.icloud-cli
  notarization: required
agents:
  manageCodexHome: false
  sharedSkills:
    - github
    - swiftui-patterns
