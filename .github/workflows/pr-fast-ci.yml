name: PR Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pr-ci-gate:
    name: PR Checks
    if: github.event_name == 'pull_request'
    runs-on:
      - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Fast checks
        run: bash scripts/ci/run-fast-checks.sh

  trusted-ci-gate:
    name: Trusted Checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: OMT-Global/icloud-cli/.github/workflows/native-trusted.yml@997923ba56572d7026a938861f25162a8f8f281b

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - pr-ci-gate
      - trusted-ci-gate
    runs-on:
      - ubuntu-latest
    steps:
      - name: Require event-specific checks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.pr-ci-gate.result }}" == "success" ]]
          else
            [[ "${{ needs.trusted-ci-gate.result }}" == "success" ]]
          fi
