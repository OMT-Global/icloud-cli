name: PR Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-gate:
    name: CI Gate
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - xcode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fast checks
        run: bash scripts/ci/run-fast-checks.sh
