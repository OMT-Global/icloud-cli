name: PR Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-gate:
    name: CI Gate
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - xcode
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Fast checks
        run: bash scripts/ci/run-fast-checks.sh
